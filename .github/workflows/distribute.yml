# Builds Rapid Wallet for TestFlight internal testing, registered development devices, or both.
# Run it from the Actions tab, or: gh workflow run distribute.yml -f target=both
#
# Uses these ScaleXY organization secrets:
#   APPLE_DEVELOPER_ACCOUNT_APPLE_DEVELOPMENT_CERTIFICATE_P12_BASE64, ..._PASSWORD
#   APPLE_DEVELOPER_ACCOUNT_APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64, ..._PASSWORD
#   APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY, ..._KEY_ID, ..._ISSUER_ID
#   APPLE_DEVELOPER_ACCOUNT_TEAM_ID
# Signing is automatic, so no profile secrets are needed, and each run picks up newly registered devices.

name: Distribute

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        default: both
        options:
          - both
          - testflight-internal
          - development

permissions:
  contents: read

concurrency:
  group: distribute
  cancel-in-progress: false

jobs:
  distribute:
    name: Build and distribute
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Set up signing
        env:
          DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APPLE_DEVELOPMENT_CERTIFICATE_P12_BASE64 }}
          DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
          DISTRIBUTION_P12: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          ASC_KEY: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY }}
        run: scripts/ci/setup-signing.sh
      - name: Archive and export
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: scripts/ci/archive-and-export.sh "${{ inputs.target }}"
      - name: Keep the development build
        # Runs after a failed upload too, because the development export comes first.
        if: ${{ !cancelled() && inputs.target != 'testflight-internal' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RapidWallet-development-${{ github.run_number }}
          path: build/export/development/RapidWallet.ipa
          if-no-files-found: warn
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
